<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
      100% { opacity: 0.35; transform: scale(1); }
    }
    @keyframes orbitPulse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }
    @keyframes pillFloat1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pillFloat2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
      100% { transform: translateY(0px); }
    }
    .orb1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 250px 180px;
    }
    .orb2 {
      animation: pulseGlow 9s ease-in-out infinite reverse;
      transform-origin: 950px 220px;
    }
    .floating-card-left {
      animation: floatSlow 8s ease-in-out infinite;
      transform-origin: 150px 210px;
    }
    .floating-card-right {
      animation: floatSlow 9s ease-in-out infinite reverse;
      transform-origin: 1050px 210px;
    }
    .pill1 {
      animation: pillFloat1 5s ease-in-out infinite;
    }
    .pill2 {
      animation: pillFloat2 6s ease-in-out infinite;
    }
    .pulse-line {
      stroke-dasharray: 12 16;
      animation: orbitPulse 25s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Glowing Orbs in the background -->
  <circle class="orb1" cx="260" cy="180" r="160" fill="url(#purpleGlow)" filter="url(#blurFilter)" />
  <circle class="orb2" cx="940" cy="220" r="170" fill="url(#cyanGlow)" filter="url(#blurFilter)" />

  <!-- Animated Dynamic Flow Lines in Background -->
  <path class="pulse-line" d="M -50 120 Q 300 20 600 130 T 1250 110" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.3" />
  <path class="pulse-line" d="M -50 310 Q 350 390 650 300 T 1250 330" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Dynamic Elements (Left & Right Flanks) -->
  <g class="floating-card-left" filter="url(#subtleShadow)">
    <rect x="70" y="110" width="160" height="200" rx="14" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="105" cy="140" r="12" fill="#ec4899" fill-opacity="0.8" />
    <rect x="125" y="135" width="80" height="10" rx="4" fill="#9ca3af" fill-opacity="0.6" />
    <rect x="90" y="170" width="120" height="75" rx="8" fill="#374151" fill-opacity="0.5" />
    <rect x="90" y="260" width="70" height="8" rx="3" fill="#60a5fa" fill-opacity="0.8" />
    <rect x="90" y="276" width="100" height="6" rx="3" fill="#6b7280" fill-opacity="0.6" />
  </g>

  <g class="floating-card-right" filter="url(#subtleShadow)">
    <rect x="970" y="110" width="160" height="200" rx="14" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="1005" cy="140" r="12" fill="#3b82f6" fill-opacity="0.8" />
    <rect x="1025" y="135" width="80" height="10" rx="4" fill="#9ca3af" fill-opacity="0.6" />
    <rect x="990" y="170" width="120" height="75" rx="8" fill="#374151" fill-opacity="0.5" />
    <rect x="990" y="260" width="85" height="8" rx="3" fill="#34d399" fill-opacity="0.8" />
    <rect x="990" y="276" width="60" height="6" rx="3" fill="#6b7280" fill-opacity="0.6" />
  </g>

  <!-- Foreground Title and Center Information (Always on Top & Crisp) -->
  <g text-anchor="middle" id="foreground-content">
    <!-- Top Pill / Category Tag -->
    <g class="pill1" transform="translate(0, 0)">
      <rect x="495" y="65" width="210" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <text x="600" y="86" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="170" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
      Creative Portfolio Platforms
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.3">
      The definitive index of SaaS products and top open-source showcase engines
    </text>

    <!-- Tagline description -->
    <text x="600" y="248" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
      Built for visual artists, designers, 3D creators, photographers &amp; modern developers
    </text>

    <!-- Interactive / Dynamic Feature Pills in Foreground -->
    <g class="pill2" transform="translate(0, 0)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(320, 290)">
        <rect x="0" y="0" width="160" height="38" rx="19" fill="#1f2937" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.2" />
        <circle cx="22" cy="19" r="6" fill="#3b82f6" />
        <text x="92" y="24" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SaaS Giants</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(500, 290)">
        <rect x="0" y="0" width="190" height="38" rx="19" fill="#1f2937" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" />
        <circle cx="22" cy="19" r="6" fill="#10b981" />
        <text x="105" y="24" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Open-Source Engines</text>
      </g>

      <!-- Pill 3: Market Analysis -->
      <g transform="translate(710, 290)">
        <rect x="0" y="0" width="170" height="38" rx="19" fill="#1f2937" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" />
        <circle cx="22" cy="19" r="6" fill="#ec4899" />
        <text x="96" y="24" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Pricing &amp; Limits</text>
      </g>
    </g>
  </g>
</svg>
